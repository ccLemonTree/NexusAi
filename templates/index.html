<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片向量查询平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>图片向量查询系统</h1>
            <p>基于向量检索的图片智能查询平台</p>
        </header>

        <!-- 查询表单 -->
        <div class="search-form">
            <div class="form-group">
                <label for="text">文本描述（可选）：</label>
                <input type="text" id="text" placeholder="输入图片描述关键词">
            </div>

            <div class="hide-completely" >
                <label for="pic_path">图片路径（可选）：</label>
                <input type="text" id="pic_path" placeholder="例如：/path/to/image.jpg">
            </div>

            <div class="hide-completely">
                <label for="device_ids">设备ID（可选，多个用逗号分隔）：</label>
                <input type="text" id="device_ids" placeholder="例如：device1,device2">
            </div>

            <div class="hide-completely">
                <div class="form-group">
                    <label for="start_time">开始时间：</label>
                    <input type="datetime-local" id="start_time">
                </div>
                <div class="hide-completely">
                    <label for="end_time">结束时间：</label>
                    <input type="datetime-local" id="end_time">
                </div>
            </div>

            <div class="form-group">
                <label for="limit">返回数量：</label>
                <select id="limit">
                    <option value="100">100</option>
                    <option value="300" selected>300</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>

            <button id="search-btn" class="btn-primary">开始查询</button>
            <button id="clear-btn" class="btn-secondary">清空条件</button>
        </div>

        <!-- 加载状态 -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>查询中，请稍候...</p>
        </div>

        <!-- 结果统计 -->
        <div class="result-stats" style="display: none;">
            <p>查询结果：<span id="result-count">0</span> 条，耗时：<span id="search-time">0</span> 秒</p>
        </div>

        <!-- 结果展示区 -->
        <div id="results" class="results-grid"></div>

        <!-- 详情模态框 -->
        <div id="detail-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
